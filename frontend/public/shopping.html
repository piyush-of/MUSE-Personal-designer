<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping - MUSE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Jost:wght@300;400;500;600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .shop-hero { background:var(--bg-muted); padding:5rem 4rem 3rem; border-bottom:1px solid var(--border); }
    .filter-bar { background:var(--bg-surface); border-bottom:1px solid var(--border); padding:1.5rem 4rem; display:flex; gap:0.6rem; flex-wrap:wrap; align-items:center; position:sticky; top:64px; z-index:100; }
    .filter-btn { font-family:var(--f-mono); font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase; padding:0.5rem 1.2rem; border:1px solid var(--border); background:transparent; color:var(--text-secondary); cursor:pointer; transition:all var(--tr); }
    .filter-btn:hover { border-color:var(--text-primary); color:var(--text-primary); }
    .filter-btn.active { background:var(--text-primary); color:var(--bg-base); border-color:var(--text-primary); }
    .filter-label { font-family:var(--f-mono); font-size:0.6rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-muted); margin-right:0.5rem; }
    .shop-body { padding:4rem; }
    .shop-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1.5rem; margin-top:2rem; }
    .cat-section { margin-bottom:4rem; }
    .cat-title { font-family:var(--f-display); font-size:1.8rem; margin-bottom:0.3rem; }
    .cat-sub { font-size:0.85rem; color:var(--text-muted); font-family:var(--f-mono); letter-spacing:0.06em; }
    .featured-banner { background:var(--bg-inverse); color:var(--text-inverse); padding:3rem 4rem; margin:2rem 0; display:grid; grid-template-columns:1fr auto; align-items:center; gap:2rem; }
    .featured-banner h3 { font-family:var(--f-display); font-size:1.6rem; color:var(--text-inverse); margin-bottom:0.5rem; }
    .featured-banner p { color:rgba(240,235,227,0.6); font-size:0.9rem; }
    .price-badge { background:var(--rose); color:#fff; font-family:var(--f-mono); font-size:0.58rem; letter-spacing:0.1em; padding:0.25rem 0.6rem; display:inline-block; }
    .empty-state { text-align:center; padding:5rem 2rem; color:var(--text-muted); }
    @media(max-width:900px){ .shop-grid{grid-template-columns:1fr 1fr;} .shop-body,.shop-hero{padding:3rem 1.5rem;} .filter-bar{padding:1rem 1.5rem;} .featured-banner{grid-template-columns:1fr;padding:2rem 1.5rem;} }
    @media(max-width:600px){ .shop-grid{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <script src="/js/nav.js"></script>
  <main class="page">

    <div class="shop-hero">
      <span class="section-label">02 - Curated Shopping</span>
      <h1>Shop the <em>Look</em></h1>
      <p style="color:var(--text-secondary);font-size:1rem;margin-top:0.8rem;max-width:520px">Curated fashion picks with direct links to Amazon India and Flipkart. Filter by your style aesthetic and find exactly what elevates your wardrobe.</p>
    </div>

    <div class="filter-bar" id="filterBar">
      <span class="filter-label">Filter:</span>
      <button class="filter-btn active" data-cat="all">All Styles</button>
      <button class="filter-btn" data-cat="neutral">Classic Neutrals</button>
      <button class="filter-btn" data-cat="earthy">Earth Tones</button>
      <button class="filter-btn" data-cat="bold">Bold &amp; Vivid</button>
      <button class="filter-btn" data-cat="pastel">Pastels</button>
      <button class="filter-btn" data-cat="classic">Timeless Classic</button>
    </div>

    <div class="shop-body" id="shopBody">
      <div id="shopContent">
      </div>
    </div>

    <footer class="site-footer">
      <div class="footer-bottom" style="border-top:none;padding-top:0">
        <p>&copy; 2026 MUSE Studio</p>
        <p>Links open Amazon India &amp; Flipkart product pages · Prices are indicative</p>
      </div>
    </footer>
  </main>

  <script src="/js/shared.js"></script>
  <script>
  'use strict';

  const CATEGORIES = {
    all:     { label:'All Styles', desc:'Browse the complete curated collection across every aesthetic' },
    neutral: { label:'Classic Neutrals', desc:'Timeless white, black, beige and camel pieces for a versatile wardrobe' },
    earthy:  { label:'Earth Tones', desc:'Terracotta, rust, olive and warm brown - the most flattering palette for Indian skin tones' },
    bold:    { label:'Bold & Vivid', desc:'Saturated colours, statement prints and eye-catching pieces that command attention' },
    pastel:  { label:'Pastels', desc:'Soft lavender, powder blue, blush and mint for an airy, feminine aesthetic' },
    classic: { label:'Timeless Classic', desc:'Tailored pieces in navy, white and black that never go out of style' },
  };

  let shopData = {};

  const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function renderShopCard(item){
    return `
    <div class="shop-card">
      <div class="shop-card__meta">
        <div>
          <span class="chip chip-sage" style="font-size:.5rem;margin-bottom:.5rem">${esc(item.category)}</span>
          <div class="shop-card__name">${esc(item.item)}</div>
        </div>
        <span class="price-badge">${esc(item.priceRange || item.price_range)}</span>
      </div>
      <p class="shop-card__why">${esc(item.why)}</p>
      <p class="shop-card__tip">💡 ${esc(item.styleTip || item.style_tip)}</p>
      <div class="shop-card__links">
        ${item.amazon?`<a href="${esc(item.amazon)}" target="_blank" rel="noopener" class="shop-link amazon">🛒 Amazon ↗</a>`:''}
        ${item.flipkart?`<a href="${esc(item.flipkart)}" target="_blank" rel="noopener" class="shop-link flipkart">🔵 Flipkart ↗</a>`:''}
      </div>
    </div>`;
  }

  async function loadShopData(){
    try{
      const res=await fetch('/api/shopping');
      const payload=await res.json();
      const items=payload.data||[];
      shopData=items.reduce((acc,item)=>{
        const key=item.styleKey||'neutral';
        if(!acc[key]) acc[key]=[];
        acc[key].push(item);
        return acc;
      },{});
      renderAll('all');
    }catch(_err){
      document.getElementById('shopContent').innerHTML='<div class="empty-state"><p>Failed to load shopping picks. Please refresh.</p></div>';
    }
  }

  function renderAll(cat){
    const content=document.getElementById('shopContent');
    if(cat==='all'){
      let html='';
      for(const [key,items] of Object.entries(shopData)){
        const catInfo=CATEGORIES[key]||{label:key,desc:''};
        html+=`<div class="cat-section">
          <span class="section-label">${esc(catInfo.label)}</span>
          <div class="cat-title">${esc(catInfo.label)}</div>
          <p class="cat-sub">${esc(catInfo.desc)}</p>
          <div class="shop-grid">${items.map(renderShopCard).join('')}</div>
        </div>`;
      }
      content.innerHTML=html || '<div class="empty-state"><p>No shopping picks available right now.</p></div>';
    } else {
      const items=shopData[cat]||[];
      const catInfo=CATEGORIES[cat]||{label:cat,desc:''};
      if(items.length===0){
        content.innerHTML='<div class="empty-state"><p>No items found for this category.</p></div>';
        return;
      }
      content.innerHTML=`<div class="cat-section">
        <span class="section-label">${esc(catInfo.label)}</span>
        <div class="cat-title">${esc(catInfo.label)}</div>
        <p class="cat-sub">${esc(catInfo.desc)}</p>
        <div class="shop-grid">${items.map(renderShopCard).join('')}</div>
      </div>`;
    }
  }

  document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderAll(btn.dataset.cat);
    });
  });

  loadShopData();
  </script>
</body>
</html>
