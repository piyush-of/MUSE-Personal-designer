version: '3.8'

services:
  db:
    image: mongo:6.0-jammy
    container_name: muse-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  web:
    build: .
    container_name: muse-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://db:27017/muse
      - JWT_SECRET=production-default-jwt-secret-key-replace-in-env-32-chars
      - JWT_REFRESH_SECRET=production-default-jwt-refresh-secret-key-replace-in-env
      - GROQ_API_KEY=
      - GROQ_MODEL=llama-3.3-70b-versatile
      - GROQ_VISION_MODEL=llama-3.2-11b-vision-preview
      - GROQ_TIMEOUT_MS=20000
      - RESEND_API_KEY=
      - EMAIL_FROM=noreply@muse.style
      - APP_URL=http://localhost:3000
      - RATE_LIMIT_ANALYZE=20
      - RATE_LIMIT_AUTH=10
      - RATE_LIMIT_GENERAL=200
    depends_on:
      - db

volumes:
  mongo-data:
